services:

  mysql:
    image: brijesh149/expense-tracker:mysql
    container_name: expense-tracker-mysql
    environment:
      MYSQL_ROOT_PASSWORD: YOUR_MYSQL_PASSWORD
      MYSQL_DATABASE: expensetracker
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - expense-tracker-network

  backend:
    image: brijesh149/expense-tracker:backend
    container_name: expense-tracker-backend
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/expensetracker
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: YOUR_MYSQL_PASSWORD
    ports:
      - "8080:8080"
    networks:
      - expense-tracker-network

  frontend:
    image: brijesh149/expense-tracker:frontend
    container_name: expense-tracker-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - expense-tracker-network

volumes:
  mysql_data:

networks:
  expense-tracker-network: